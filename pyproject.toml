[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msrc-sim"
version = "0.8.3"
description = "Simulator for the Multi-Species Rearrangement Coalescent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
msrc-sim = "msrcsim.cli:main"
msrc-sim-replicates = "msrcsim.replicate_cli:main"
msrc-sim-grid = "msrcsim.grid_cli:main"
msrc-sim-compare = "msrcsim.model_comparison_cli:main"
msrc-sim-freeze-history = "msrcsim.freeze_history_cli:main"
msrc-sim-replay-history = "msrcsim.replay_history_cli:main"
msrc-sim-plot = "msrcsim.plot_cli:main"
msrc-sim-plot-history = "msrcsim.plot_history_cli:main"
msrc-sim-spatial = "msrcsim.spatial_cli:main"
msrc-sim-plot-spatial = "msrcsim.spatial_plot_cli:main"
msrc-sim-spatial-summarize = "msrcsim.spatial_summarize_cli:main"
msrc-sim-hybridization = "msrcsim.hybridization_cli:main"
msrc-sim-plot-spatial-compare = "msrcsim.spatial_compare_cli:main"
msrc-sim-find-matched-hybridization = "msrcsim.spatial_match_cli:main"
msrc-sim-match-hybridization = "msrcsim.hybridization_match_cli:main"
msrc-sim-spatial-distinguishability = "msrcsim.spatial_distinguishability_cli:main"
msrc-sim-spatial-identifiability = "msrcsim.spatial_identifiability_cli:main"
msrc-sim-species-tree-robustness = "msrcsim.robustness_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["msrcsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

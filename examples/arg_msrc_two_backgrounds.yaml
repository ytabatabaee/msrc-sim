mode: arg
seed: 20261109

species_tree:
  newick: "((1:100,2:100)A:50,(3:100,4:100)B:50)ROOT;"
  time_units: generations
  root_extension: 1000
  default_effective_population_size: 100

population_process:
  model: moran

rearrangement:
  id: inv_1
  type: inversion
  origin_branch: ROOT
  origin_time_from_branch_start: 120
  initial_copy_count: 40
  selection:
    model: genic
    coefficient: 0.0

arg:
  model: hudson
  background_model: msrc_two_state
  sequence_length_bp: 1000000
  recombination_rate_per_bp: 1.0e-8
  rearrangement_interval:
    start: 250000
    end: 650000
  background_anchor_bp: 450000
  cross_background_suppression: 0.01
  # Optional explicit terminal states; omit this mapping to sample once from
  # the realized terminal frequency history.
  sampled_backgrounds:
    1: 1
    2: 1
    3: 0
    4: 0

output:
  directory: arg_msrc_output
  record_tree_sequence: true
  record_gene_trees: true
  record_events: true

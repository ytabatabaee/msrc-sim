mode: spatial
seed: 808

species_tree:
  newick: "((1:100,2:100)A:50,(3:100,4:100)B:50)ROOT;"
  time_units: generations
  root_extension: 300
  default_effective_population_size: 100

rearrangement:
  id: inv_1
  type: inversion
  origin_branch: ROOT
  origin_time_from_branch_start: 120
  initial_copy_count: 40
  selection:
    model: genic
    coefficient: 0.0

recombination:
  baseline_rate: 0.02
  effective_cross_arrangement_fraction: 0.1

genome:
  length: 1000000
  loci:
    count: 200
    placement: evenly_spaced
  rearrangement_interval:
    id: inv_1
    start: 250000
    end: 650000
  inside_model:
    type: msrc
    effective_cross_arrangement_fraction: 0.05
  outside_model:
    type: msc

linked_spatial:
  enabled: true
  chrom: chr1
  kappa: 0.1
  breakpoint_rate_per_bp: 0.00002
  windows:
    count: 200

output:
  directory: linked_spatial_output
  record_resolved_config: true
  make_plots: false

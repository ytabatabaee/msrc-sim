mode: parameter_grid
seed: 12345
species_tree:
  newick: "((1:20,2:20)A:10,(3:20,4:20)B:10)ROOT;"
  time_units: generations
  root_extension: 50
  default_effective_population_size: 50
rearrangement:
  id: inv_1
  type: inversion
  origin_branch: ROOT
  origin_time_from_branch_start: 5
  initial_copy_count: 20
  selection:
    model: genic
    coefficient: 0.0
recombination:
  baseline_rate: 0.02
  effective_cross_arrangement_fraction: 0.1
sampling:
  samples_per_species: 1
conditioning:
  mode: none
experiment:
  replicates: 5
  loci_per_replicate: 100
  asymmetry_threshold: 0.10
  persistence_target_branches: [ROOT]
parameter_grid:
  species_tree.default_effective_population_size: [25, 50]
  rearrangement.initial_copy_count: [10, 20]
  recombination.effective_cross_arrangement_fraction: [0.01, 0.1]
output:
  directory: parameter_grid_output
